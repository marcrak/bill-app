<script>
    // 🌐 云端 JSONBin 配置
    const JSONBIN_BIN_ID = '6a7b19ceda38895dfed59a4c';
    const JSONBIN_MASTER_KEY = '$2a$10$9wUKrLOR6alaE78jfQiLiuARNjff/gpvmOzidrhTbDE2fAbCARaWS';
    
    let customerList = JSON.parse(localStorage.getItem('customerList')) || ["张记", "柳北", "开心"];
    let productList = JSON.parse(localStorage.getItem('productList')) || [
        { id: 1, name: "蒜米", price: 3.5 },
        { id: 2, name: "假树叶", price: 5.0 },
        { id: 3, name: "紫苏", price: 5.0 },
        { id: 4, name: "洋葱", price: 2.0 },
        { id: 5, name: "白萝卜", price: 1.2 },
        { id: 6, name: "香菜", price: 6.5 },
        { id: 7, name: "葱花", price: 4.0 },
        { id: 8, name: "青瓜", price: 2.5 },
        { id: 9, name: "油菜心", price: 4.0 },
        { id: 10, name: "红萝卜", price: 1.8 }
    ];
    let cart = {};
    let activeLetter = '';
    let toastTimer = null;
    let isDeleteMode = false;
    let selectedDeleteIds = new Set();
    
    // 防打断输入标记与同步锁
    let isUserTyping = false;
    let isSyncing = false;

    // 监控键盘输入状态：输入时不自动更新 UI 避免打断光标
    document.addEventListener('focusin', (e) => {
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') isUserTyping = true;
    });
    document.addEventListener('focusout', (e) => {
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') {
            isUserTyping = false;
            triggerCloudSync(); // 离开输入框时立刻上传同步
        }
    });

    // 🌐 向云端保存数据
    async function syncToCloud() {
        try {
            updateSyncBadge('☁️ 正在同步...', '#1890ff');
            const payload = {
                customerList: customerList,
                productList: productList,
                cart: cart,
                updatedAt: Date.now()
            };
            const response = await fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}`, {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json',
                    'X-Master-Key': JSONBIN_MASTER_KEY
                },
                body: JSON.stringify(payload)
            });
            if (response.ok) {
                updateSyncBadge('✅ 实时同步中', '#52c41a');
            } else {
                updateSyncBadge('⚠️ 同步失败', '#ff4d4f');
            }
        } catch (err) {
            console.error('云端保存失败:', err);
            updateSyncBadge('⚠️ 网络异常', '#ff4d4f');
        }
    }

    // 🌐 从云端拉取数据
    async function fetchFromCloud() {
        if (isUserTyping || isSyncing) return;
        try {
            const response = await fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}/latest`, {
                headers: {
                    'X-Master-Key': JSONBIN_MASTER_KEY
                }
            });
            if (response.ok) {
                const data = await response.json();
                const record = data.record;
                if (record && record.productList) {
                    productList = record.productList;
                    cart = record.cart || {};
                    if (record.customerList) customerList = record.customerList;
                    
                    localStorage.setItem('productList', JSON.stringify(productList));
                    localStorage.setItem('customerList', JSON.stringify(customerList));

                    renderCustomers();
                    renderTable();
                    renderRightAlphaIndex();
                    updateSyncBadge('✅ 实时同步中', '#52c41a');
                }
            }
        } catch (err) {
            console.error('云端拉取失败:', err);
        }
    }

    function updateSyncBadge(text, color) {
        const badge = document.getElementById('syncStatus');
        if (badge) {
            badge.innerText = text;
            badge.style.color = color;
        }
    }

    let syncTimer = null;
    function triggerCloudSync() {
        localStorage.setItem('productList', JSON.stringify(productList));
        localStorage.setItem('customerList', JSON.stringify(customerList));
        if (syncTimer) clearTimeout(syncTimer);
        syncTimer = setTimeout(() => {
            syncToCloud();
        }, 500);
    }

    // 汉字首字母提取
    function getPinyinInitial(str) {
        if (!str) return '#';
        try {
            const pinyin = str.localeCompare('', 'zh-Hans-CN-u-co-pinyin');
            if (typeof Intl !== 'undefined' && Intl.Segmenter) {
                // 默认使用拼音首字母比对范围
            }
            // 利用 localeCompare 进行拼音首字母区间估算
            const c = str.charAt(0);
            if (c.match(/[a-zA-Z]/)) return c.toUpperCase();
            if (c.localeCompare('八') < 0) return '#';
            if (c.localeCompare('嚓') < 0) return 'B';
            if (c.localeCompare(' see') < 0 && c.localeCompare('搭') < 0) return 'C';
            if (c.localeCompare('蛾') < 0) return 'D';
            if (c.localeCompare('发') < 0) return 'E';
            if (c.localeCompare('噶') < 0) return 'F';
            if (c.localeCompare('哈') < 0) return 'G';
            if (c.localeCompare('击') < 0) return 'H';
            if (c.localeCompare('喀') < 0) return 'J';
            if (c.localeCompare('垃圾') < 0) return 'K';
            if (c.localeCompare('妈') < 0) return 'L';
            if (c.localeCompare('拿') < 0) return 'M';
            if (c.localeCompare('噢') < 0) return 'N';
            if (c.localeCompare('啪') < 0) return 'O';
            if (c.localeCompare('七') < 0) return 'P';
            if (c.localeCompare('然') < 0) return 'Q';
            if (c.localeCompare('撒') < 0) return 'R';
            if (c.localeCompare('塌') < 0) return 'S';
            if (c.localeCompare('挖') < 0) return 'T';
            if (c.localeCompare('昔') < 0) return 'W';
            if (c.localeCompare('压') < 0) return 'X';
            if (c.localeCompare('匝') < 0) return 'Y';
            if (c.localeCompare('座') <= 0) return 'Z';
        } catch (e) {
            console.error(e);
        }
        return '#';
    }

    // 渲染客户下拉菜单
    function renderCustomers() {
        const select = document.getElementById('customerSelect');
        select.innerHTML = customerList.map(c => `<option value="${c}">${c}</option>`).join('');
    }

    // 添加新客户
    function addNewCustomer() {
        const input = document.getElementById('newCustomerName');
        const name = input.value.trim();
        if (!name) return alert('请输入客户名称！');
        if (!customerList.includes(name)) {
            customerList.push(name);
            renderCustomers();
            select.value = name;
            triggerCloudSync();
        }
        input.value = '';
    }

    // 添加新菜品
    function addNewProduct() {
        const nameInput = document.getElementById('newGoodsName');
        const priceInput = document.getElementById('newGoodsPrice');
        const name = nameInput.value.trim();
        const price = parseFloat(priceInput.value) || 0;

        if (!name) return alert('请输入菜品名称！');

        const newId = productList.length ? Math.max(...productList.map(p => p.id)) + 1 : 1;
        productList.push({ id: newId, name: name, price: price });

        nameInput.value = '';
        priceInput.value = '';

        renderTable();
        renderRightAlphaIndex();
        triggerCloudSync();
    }

    // 渲染开单表格
    function renderTable() {
        const tbody = document.getElementById('goodsBody');
        const filterText = document.getElementById('searchInput').value.trim().toLowerCase();
        
        // 排序与分组
        let sorted = [...productList].sort((a, b) => a.name.localeCompare(b.name, 'zh-Hans-CN'));
        
        if (filterText) {
            sorted = sorted.filter(p => p.name.toLowerCase().includes(filterText) || getPinyinInitial(p.name).toLowerCase().includes(filterText));
        }

        let html = '';
        let lastLetter = '';
        let totalQty = 0;
        let totalAmount = 0;

        sorted.forEach(p => {
            const letter = getPinyinInitial(p.name);
            if (letter !== lastLetter && !filterText) {
                html += `<tr class="section-header-tr" id="sec-${letter}"><td colspan="3" class="section-header-td">${letter}</td></tr>`;
                lastLetter = letter;
            }

            const qty = cart[p.id] || 0;
            if (qty > 0) {
                totalQty += 1;
                totalAmount += qty * p.price;
            }

            html += `
                <tr>
                    <td style="text-align:left; padding-left:8px;">
                        ${isDeleteMode ? `<input type="checkbox" onchange="toggleSelectDelete(${p.id})" ${selectedDeleteIds.has(p.id) ? 'checked' : ''}> ` : ''}
                        <input type="text" class="name-input" value="${p.name}" onchange="updateProductName(${p.id}, this.value)">
                    </td>
                    <td>
                        <div class="qty-box">
                            <button class="qty-btn" onclick="changeQty(${p.id}, -1)">-</button>
                            <input type="number" class="qty-input" value="${qty || ''}" placeholder="0" onchange="setQty(${p.id}, this.value)">
                            <button class="qty-btn" onclick="changeQty(${p.id}, 1)">+</button>
                        </div>
                    </td>
                    <td class="col-price">
                        <input type="number" class="price-input" value="${p.price}" step="0.1" onchange="updateProductPrice(${p.id}, this.value)">
                    </td>
                </tr>
            `;
        });

        tbody.innerHTML = html;
        document.getElementById('totalQty').innerText = totalQty;
        document.getElementById('totalAmount').innerText = totalAmount.toFixed(2);
    }

    // 修改数量与价格
    function changeQty(id, delta) {
        const current = cart[id] || 0;
        const next = Math.max(0, current + delta);
        if (next === 0) delete cart[id];
        else cart[id] = next;
        renderTable();
        triggerCloudSync();
    }

    function setQty(id, val) {
        const qty = parseFloat(val) || 0;
        if (qty <= 0) delete cart[id];
        else cart[id] = qty;
        renderTable();
        triggerCloudSync();
    }

    function updateProductName(id, name) {
        const item = productList.find(p => p.id === id);
        if (item) {
            item.name = name;
            triggerCloudSync();
        }
    }

    function updateProductPrice(id, price) {
        const item = productList.find(p => p.id === id);
        if (item) {
            item.price = parseFloat(price) || 0;
            renderTable();
            triggerCloudSync();
        }
    }

    // 智能文本解析
    function parseText() {
        const text = document.getElementById('aiInput').value;
        if (!text.trim()) return alert('请粘贴微信消息！');

        // 正则提取 菜名 + 数字/斤/包
        const regex = /([\u4e00-\u9fa5]+)\s*(\d+(\.\d+)?)\s*(斤|包|个|箱)?/g;
        let match;
        let addedCount = 0;

        while ((match = regex.exec(text)) !== null) {
            const name = match[1];
            const qty = parseFloat(match[2]);

            let prod = productList.find(p => p.name.includes(name) || name.includes(p.name));
            if (prod) {
                cart[prod.id] = (cart[prod.id] || 0) + qty;
                addedCount++;
            }
        }

        if (addedCount > 0) {
            alert(`成功自动匹配并填入 ${addedCount} 项菜品！`);
            renderTable();
            triggerCloudSync();
        } else {
            alert('未能匹配到现有菜品，请手动选择或确认菜名！');
        }
    }

    // 搜索过滤
    function onSearchInput() {
        renderTable();
    }

    // 隐藏单价列
    function togglePriceColumn() {
        const hide = document.getElementById('togglePrice').checked;
        const tableCard = document.getElementById('tableCard');
        if (hide) tableCard.classList.add('hide-price');
        else tableCard.classList.remove('hide-price');
    }

    // 渲染右侧字母索引条
    function renderRightAlphaIndex() {
        const letters = Array.from(new Set(productList.map(p => getPinyinInitial(p.name)))).sort();
        const sidebar = document.getElementById('contactsAlphaSidebar');
        sidebar.innerHTML = letters.map(l => `<div class="sidebar-letter" onclick="scrollToSection('${l}')">${l}</div>`).join('');
    }

    function scrollToSection(letter) {
        const el = document.getElementById(`sec-${letter}`);
        if (el) el.scrollIntoView({ behavior: 'smooth' });
    }

    // 删除模式
    function toggleDeleteMode() {
        isDeleteMode = !isDeleteMode;
        selectedDeleteIds.clear();
        document.getElementById('deleteBar').classList.toggle('active', isDeleteMode);
        document.getElementById('deleteCount').innerText = '0';
        renderTable();
    }

    function toggleSelectDelete(id) {
        if (selectedDeleteIds.has(id)) selectedDeleteIds.delete(id);
        else selectedDeleteIds.add(id);
        document.getElementById('deleteCount').innerText = selectedDeleteIds.size;
    }

    function confirmBatchDelete() {
        if (selectedDeleteIds.size === 0) return alert('请先勾选需要删除的菜品！');
        if (confirm(`确定要彻底删除选中的 ${selectedDeleteIds.size} 项菜品吗？`)) {
            productList = productList.filter(p => !selectedDeleteIds.has(p.id));
            selectedDeleteIds.forEach(id => delete cart[id]);
            toggleDeleteMode();
            renderRightAlphaIndex();
            triggerCloudSync();
        }
    }

    // 清空选择
    function clearAll() {
        if (confirm('确定要清空当前的已选菜品数量吗？')) {
            cart = {};
            renderTable();
            triggerCloudSync();
        }
    }

    // 导出账单
    function exportBill() {
        const customer = document.getElementById('customerSelect').value;
        let text = `📋 【${customer}】菜品账单明细\n------------------------\n`;
        let total = 0;

        productList.forEach(p => {
            const qty = cart[p.id];
            if (qty) {
                const sub = qty * p.price;
                total += sub;
                text += `${p.name} × ${qty} = ¥${sub.toFixed(1)}\n`;
            }
        });

        text += `------------------------\n合计总额：¥${total.toFixed(2)}`;
        document.getElementById('exportText').value = text;
        document.getElementById('exportModal').style.display = 'flex';
    }

    function closeModal() {
        document.getElementById('exportModal').style.display = 'none';
    }

    function copyExportText() {
        const text = document.getElementById('exportText');
        text.select();
        document.execCommand('copy');
        alert('账单已成功复制到剪贴板！');
    }

    function downloadTextFile() {
        const text = document.getElementById('exportText').value;
        const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `账单_${new Date().toLocaleDateString()}.txt`;
        a.click();
    }

    function exportToImage() {
        const target = document.getElementById('imageCaptureTarget');
        target.innerText = document.getElementById('exportText').value;
        html2canvas(target).then(canvas => {
            const link = document.createElement('a');
            link.download = `账单_${Date.now()}.png`;
            link.href = canvas.toDataURL();
            link.click();
        });
    }

    // 初始化加载
    window.onload = function() {
        renderCustomers();
        renderTable();
        renderRightAlphaIndex();
        fetchFromCloud();

        // 定时轮询同步云端 (每 5 秒)
        setInterval(fetchFromCloud, 5000);
    };
</script>
